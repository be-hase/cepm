version: 2

project_name: cepm

builds:
  - main: ./cmd/cepm
    binary: cepm
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - arm64
      - amd64
    ldflags:
      - -s -w -X github.com/be-hase/cepm/internal/cli.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  draft: false

# No "sort:". GoReleaser sorts by commit subject, not by time, so "asc"
# produced an alphabetical list with "Initial commit" in the middle of it —
# see the v0.0.1 release notes. Left unset, git's own order (chronological)
# survives, which is what a reader of release notes expects.
changelog:
  use: github
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

# Homebrew tap for internal distribution. Create the tap repository, add a
# token that can push to it as the TAP_GITHUB_TOKEN secret (see
# .github/workflows/release.yml), then uncomment.
# brews:
#   - repository:
#       owner: your-org
#       name: homebrew-tap
#       token: "{{ .Env.TAP_GITHUB_TOKEN }}"
#     homepage: https://github.com/be-hase/cepm
#     description: Keep git-distributed unpacked Chrome extensions up to date
#     install: |
#       bin.install "cepm"
#     caveats: |
#       Run "cepm setup" once, then load ~/.cepm/helper in chrome://extensions.
