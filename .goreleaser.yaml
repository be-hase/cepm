version: 2

project_name: cepm

builds:
  - main: ./cmd/cepm
    binary: cepm
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - arm64
      - amd64
    ldflags:
      - -s -w -X github.com/be-hase/cepm/internal/cli.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  draft: false

# No "sort:". GoReleaser sorts by commit subject, not by time, so "asc"
# produced an alphabetical list with "Initial commit" in the middle of it —
# see the v0.0.1 release notes. Left unset, git's own order (chronological)
# survives, which is what a reader of release notes expects.
changelog:
  use: github
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

# A cask, not a formula: GoReleaser deprecated "brews" for prebuilt
# binaries. Casks are macOS-only — Linux keeps the tar.gz above. The tap
# lives in its own repository, so pushing the cask needs a token that can
# reach it; GITHUB_TOKEN cannot. See TAP_GITHUB_TOKEN in
# .github/workflows/release.yml.
homebrew_casks:
  - repository:
      owner: be-hase
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/be-hase/cepm
    description: Keep git-distributed unpacked Chrome extensions up to date
    caveats: |
      Run "cepm setup" once, then load ~/.cepm/helper in chrome://extensions.
    # The binaries are not notarized, and Homebrew's own download carries
    # the quarantine flag — without this, Gatekeeper refuses to run cepm.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/cepm"]
          end
