name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser needs the full history for changelogs
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The last line of defense before a binary ships: nothing enforces
      # that the tagged commit is one CI already proved green.
      - name: test
        run: go test -race ./...
      - name: e2e
        run: make e2e
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A tap in another repository needs a token that can push there;
          # see the brews section in .goreleaser.yaml.
          # TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
