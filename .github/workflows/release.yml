name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default; only the job that creates the GitHub Release gets
# write access.
permissions:
  contents: read

jobs:
  semver:
    # GoReleaser derives the version from the tag, and a malformed one fails
    # late and messily — refuse it before spending the verification minutes.
    # The pattern is strict SemVer 2.0.0 with a v prefix (no leading zeros,
    # no empty identifiers); internal/workflows pins it against an
    # accept/reject table.
    runs-on: ubuntu-latest
    steps:
      - name: verify the tag is semver
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*)?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?$' \
            || { echo "tag $TAG is not strict semver (vX.Y.Z[-prerelease][+metadata])" >&2; exit 1; }

  # The tagged commit gets the full CI treatment — lint gates, -race tests
  # and the real-Chrome e2e on both OSes. Pushes to main run CI, but nothing
  # else guarantees the commit a tag points at ever went through it. It runs
  # after the cheap tag check so a malformed tag never spends these minutes.
  verify:
    needs: semver
    uses: ./.github/workflows/ci.yml

  release:
    needs: [semver, verify]
    permissions:
      contents: write # creates the GitHub Release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser needs the full history for changelogs
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Exact, not "~> v2": a range lets the release toolchain drift
          # between two runs of the same tag. Dependabot does not track this
          # pin — bump it deliberately (internal/workflows enforces the
          # exact-version shape).
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The tap is another repository, which GITHUB_TOKEN cannot reach:
          # a fine-grained PAT scoped to be-hase/homebrew-tap with contents
          # read/write, stored as this secret. See brews in .goreleaser.yaml.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
