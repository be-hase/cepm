name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default; only the job that creates the GitHub Release gets
# write access.
permissions:
  contents: read

jobs:
  semver:
    # GoReleaser derives the version from the tag, and a malformed one fails
    # late and messily — refuse it before spending the verification minutes.
    runs-on: ubuntu-latest
    steps:
      - name: verify the tag is semver
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$' \
            || { echo "tag $TAG is not semver (vX.Y.Z[-prerelease][+metadata])" >&2; exit 1; }

  # The tagged commit gets the full CI treatment — lint gates, -race tests
  # and the real-Chrome e2e on both OSes. Pushes to main run CI, but nothing
  # else guarantees the commit a tag points at ever went through it.
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: [semver, verify]
    permissions:
      contents: write # creates the GitHub Release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # goreleaser needs the full history for changelogs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A tap in another repository needs a token that can push there;
          # see the brews section in .goreleaser.yaml.
          # TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
