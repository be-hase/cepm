name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by the release workflow so a tagged commit gets exactly this
  # verification: a called run checks out the caller's ref, which for a tag
  # push is the tagged commit.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: staticcheck
        run: go tool staticcheck ./...
      - name: staticcheck (e2e tag)
        # The e2e harness is invisible to the untagged run: build-tagged
        # files are where a race last hid, so lint them here and race-test
        # them in the e2e job.
        run: go tool staticcheck -tags e2e ./...
      - name: test
        # -race on every run: the host/updater locking discipline is this
        # project's hard part, and the suite has real concurrency tests.
        run: go test -race ./...
      - name: build
        run: go build ./cmd/cepm

  e2e:
    # Drives a real Chrome (downloaded Chrome for Testing) end to end.
    # Linux is covered too: its native messaging paths, launcher and socket
    # handling are otherwise never exercised.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: install Chrome dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64
      - name: e2e
        run: make e2e
